name: "Test KNIME workflows"
on:
  workflow_dispatch:
    inputs:
      updateURL:
        type: string
        description: use a specific location for the knime update site
        default: https://abibuilder.cs.uni-tuebingen.de/archive/openms/knime-plugin/updateSite/nightly/
jobs:
  test-knime:
    env:
      GH_TOKEN: ${{ github.token }}
      KNIME_MAJOR_VERSION: 5
      KNIME_MINOR_VERSION: 4
      INSTALLATION_DIR: ${{ github.workspace }}
    runs-on: ubuntu-latest
    steps:
      - name: Set more env
        run: |
          echo "KNIME_VERSION=${KNIME_MAJOR_VERSION}.${KNIME_MINOR_VERSION}" >> $GITHUB_ENV
          echo "KNIME_DIR=${INSTALLATION_DIR}/knime" >> $GITHUB_ENV
          echo "DOWNLOAD_URL=https://download.knime.org/analytics-platform/linux/knime-latest${KNIME_MAJOR_VERSION}${KNIME_MINOR_VERSION}-linux.gtk.x86_64.tar.gz" >> $GITHUB_ENV

      - name: Install deps
        run: |
          sudo apt-get update
          # KNIME (Eclipse/SWT) and bundled Chromium need X11/GTK even in batch mode on CI.
          sudo apt-get install -y \
            software-properties-common curl tzdata \
            xvfb xauth \
            libgtk-3-0 libxtst6 libxss1 libnss3 libasound2 \
            libgbm1 libdrm2 libx11-xcb1 libatk-bridge2.0-0 libatspi2.0-0 \
            libxdamage1 libxcomposite1 libxrandr2 libxfixes3 libxkbcommon0 \
            libxext6 libxrender1 libxi6 libcups2 libdbus-1-3 \
            libglib2.0-0
          # Optional/legacy libs depending on the ubuntu-latest version.
          sudo apt-get install -y libgtk2.0-0 || true
          sudo apt-get install -y libwebkit2gtk-4.1-0 || sudo apt-get install -y libwebkit2gtk-4.0-37 || true
          sudo apt-get install -y python3 python3-dev python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install pandas protobuf
          sudo apt-get install -y r-base r-recommended

      - name: Install KNIME
        run: |
          curl -L "$DOWNLOAD_URL" | tar vxz -C $INSTALLATION_DIR \
            && mv $INSTALLATION_DIR/knime_* $INSTALLATION_DIR/knime

      - name: Install and start Rserve
        run: |
          mkdir -p ~/local/R_libs
          if ! command -v R >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y r-base r-recommended
          fi
          R -e 'install.packages(c("Rserve"), repos="https://cran.rstudio.com/", lib="~/local/R_libs/")'

      - name: Install OpenMS plugin
        run: |
          xvfb-run -a "$KNIME_DIR/knime" -application org.eclipse.equinox.p2.director \
            -r "http://update.knime.com/analytics-platform/${KNIME_VERSION},${{ inputs.updateURL }}" \
            -p2.arch x86_64 \
            -profileProperties org.eclipse.update.install.features=true \
            -i "de.openms.feature.feature.group,com.genericworkflownodes.knime.feature.feature.group,de.openms.thirdparty.feature.feature.group" \
            -p KNIMEProfile \
            -nosplash

      - name: Install other plugins
        run: |
          xvfb-run -a "$KNIME_DIR/knime" -application org.eclipse.equinox.p2.director \
            -r "http://update.knime.com/analytics-platform/${KNIME_VERSION},http://update.knime.com/community-contributions/trunk" \
            -p2.arch x86_64 \
            -profileProperties org.eclipse.update.install.features=true \
            -i "org.knime.features.r.feature.group,org.knime.features.chem.types.feature.group,org.knime.features.ext.svg.feature.group" \
            -p KNIMEProfile \
            -nosplash

      - name: Create Workspace and fill with input data
        run: |
          wget -c https://abibuilder.cs.uni-tuebingen.de/archive/openms/Tutorials/Example_Data.tar.gz -O - | tar -xz
          mkdir -p "${INSTALLATION_DIR}/OpenMS-Tutorials"
          rm -rf "${INSTALLATION_DIR}/OpenMS-Tutorials/data"
          ln -s "${INSTALLATION_DIR}/Example_Data" "${INSTALLATION_DIR}/OpenMS-Tutorials/data"

      - name: Clone Tutorials
        run: |
          set -euo pipefail
          gh repo clone OpenMS/Tutorials
          pushd Tutorials/Workflows
            for wf in basic_peptide_*.knwf
            do
              echo "Running workflow: ${wf}"
              set +e
              xvfb-run -a "$KNIME_DIR/knime" -consoleLog --launcher.suppressErrors -nosave -nosplash \
                -data "${INSTALLATION_DIR}" \
                -application org.knime.product.KNIME_BATCH_APPLICATION \
                -workflowFile="$(pwd)/${wf}" \
                -reset \
                -vmargs -Djava.io.tmpdir="${INSTALLATION_DIR}" -Djava.awt.headless=true \
                --add-opens=java.base/sun.net.www.protocol.http=ALL-UNNAMED \
                > "log_${wf}.txt" 2>&1
              rc=$?
              set -e
              if [ "${rc}" -ne 0 ]; then
                echo "KNIME failed for ${wf} (exit ${rc}). Log:"
                cat "log_${wf}.txt"
                exit "${rc}"
              fi
            done
            cat log*.txt
          popd
